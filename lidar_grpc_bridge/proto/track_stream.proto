// Return path: Inf computer -> Robot (Tracked postions )
// Regenerate with (venv active, from the package root):
//   python -m grpc_tools.protoc -I proto --python_out=lidar_grpc_bridge \
//       --grpc_python_out=lidar_grpc_bridge proto/track_stream.proto

syntax = "proto3";

package track;

message Track {
  int32 id = 1;        // stable across frames
  float x = 2;         // m
  float y = 3;         // m
  float vx = 4;        // m/s
  float vy = 5;        // m/s
  float speed = 6;     // m/s
  float heading = 7;   // rad, atan2(vy, vx); meaningless when speed ~ 0
  bool moving = 8;      // tracker's own stationary/moving judgement
}

message TrackArray {
  double timestamp = 1;   // seconds, from the source scan
  string frame_id = 2;    // frame the coordinates are expressed in
  repeated Track tracks = 3;
}

message PushAck {
  int32 tracks_received = 1;
}

service TrackService {
  rpc PushTracks(stream TrackArray) returns (PushAck);
}
