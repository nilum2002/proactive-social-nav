lidar_grpc_server_node:
  ros__parameters:
    scan_topic: "/scan"
    bind_address: "0.0.0.0"   # 0.0.0.0 so the consumer at 192.168.0.200 can reach us
    port: 50051
    max_clients: 4            # thread pool is sized to this + 2
    max_message_mb: 10
    status_log_period_s: 5.0  # 0.0 disables the periodic rate/client log

    # Return path: tracks pushed up by the inference host (TrackService/PushTracks)
    # are republished here, on this same server process/port.
    tracks_topic: "~/tracks"
    track_poses_topic: "~/track_poses"
    track_frame_id: ""              # "" = keep whatever frame_id the pusher sent
    use_source_track_timestamp: true

    # Odometry: streams kobuki_base_node's odom->base_link pose to the consumer over
    # OdometryService/StreamOdometry, so RViz/tf2 there don't depend on native ROS2
    # DDS discovery reaching across the network (same reasoning as the scan itself
    # going over gRPC). Requires kobuki_base_node (or something else publishing
    # nav_msgs/Odometry on odom_topic) to be running on this machine.
    enable_odom: true
    odom_topic: "/odom"
