twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.5      # seconds without a message before this input is considered gone
        priority: 100      # highest: manual override always wins while actively driving
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10       # Nav2's controller_server output — wired in the next phase
