inf_client_wifi_node:
  ros__parameters:
    # ── Topics ─────────────────────────────────────────────────────────────
    scan_topic: "/scan"
    odom_topic: "/odom"
    out_scan_topic: "/wifi/scan"
    out_odom_topic: "/wifi/odom"
    robot_name: "botzilla"

    # ── QoS ────────────────────────────────────────────────────────────────
    input_reliability: "best_effort"
    output_reliability: "best_effort" 
    output_depth: 1 
    # ── Rate ───────────────────────────────────────────────────────────────
    scan_decimation: 1
    odom_max_rate_hz: 25.0
    status_log_period_s: 5.0
