inf_client_udp_node:
  ros__parameters:
    # ── Link ───────────────────────────────────────────────────────────────
    server_address: "192.168.0.100:50054"
    scan_topic: "/scan"
    odom_topic: "/odom"
    robot_name: "botzilla"
    snd_buffer_kb: 512
    dscp: 0
    # ── Session / liveness ─────────────────────────────────────────────────
    keepalive_period_s: 1.0
    heartbeat_idle_s: 1.0
    status_log_period_s: 5.0

    # ── Odometry ───────────────────────────────────────────────────────────
    odom_redundancy: 3
    odom_max_rate_hz: 25.0

    # ── Rate adaptation ────────────────────────────────────────────────────
    adaptive_rate: true
    loss_high_ratio: 0.10
    loss_low_ratio: 0.02
    max_decimation: 4
